<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecture Notes Summarizer</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 10px; }
    textarea { width: 100%; height: 150px; }
    .entry { border-bottom: 1px solid #ccc; padding: 8px 0; }
  </style>
</head>
<body>
  <h1>Lecture Notes Summarizer</h1>
  <p>Paste your lecture notes below and click Summarize. Uses Azure AI Language.</p>

  <label>Course:</label>
  <input id="course" placeholder="e.g. CSE 475">
  <br><br>
  <textarea id="notes" placeholder="Paste notes here..."></textarea>
  <br>
  <button onclick="summarize()">Summarize</button>

  <h2>Result</h2>
  <div id="result">Nothing yet.</div>

  <h2>History</h2>
  <div id="history">Loading...</div>

  <script>
    async function summarize() {
      const text = document.getElementById("notes").value;
      const course = document.getElementById("course").value || "General";
      document.getElementById("result").innerText = "Summarizing...";

      const res = await fetch("/api/summarize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, course: course })
      });
      const data = await res.json();

      if (data.error) {
        document.getElementById("result").innerText = "Error: " + data.error;
        return;
      }

      document.getElementById("result").innerHTML =
        "<p><b>Summary:</b> " + (data.summary || "(not available)") + "</p>" +
        "<p><b>Key phrases:</b> " + data.keyPhrases.join(", ") + "</p>";

      loadHistory();
    }

    async function loadHistory() {
      const res = await fetch("/api/history");
      const items = await res.json();
      const div = document.getElementById("history");

      if (items.length === 0) {
        div.innerText = "No summaries yet.";
        return;
      }

      div.innerHTML = "";
      for (const item of items) {
        const entry = document.createElement("div");
        entry.className = "entry";
        entry.innerHTML = "<b>" + item.course + "</b><br>" + item.summary;
        div.appendChild(entry);
      }
    }

    loadHistory();
  </script>
</body>
</html>
